services:
  mongo:
    image: mongo:7.0
    container_name: elev9-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elev9-api
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/elev9
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      OBSERVABILITY_OTLP_ENDPOINT: ${OBSERVABILITY_OTLP_ENDPOINT:-http://otel-collector:4318}

  otel-collector:
    image: otel/opentelemetry-collector:0.141.0
    container_name: elev9-otel-collector
    profiles:
      - observability
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:13133:13133'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:13133/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
